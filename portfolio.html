<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Media | Portfolio</title>
    <meta name="description" content="Portfolio of KB Media: soccer, baseball, portraits, events and real estate across the Okanagan, based in Vernon, BC.">
    <meta property="og:title" content="KB Media | Portfolio">
    <meta property="og:image" content="https://kbmediaca.com/images/imagesSports/Sports-10.jpg">
    <link rel="icon" href="logo.jpeg">
    <style>
        :root {
            --bg-dark: #050505;
            --card-dark: #121212;
            --accent-white: #ffffff;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --border-color: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); }
        a { text-decoration: none; color: inherit; }

        header {
            padding: 0.9rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(5, 5, 5, 0.95);
            position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .brand-wrapper { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .brand-logo-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.3); }
        
        .logo-text-fused {
            display: flex; align-items: center; font-size: 1.05rem; font-weight: 900;
            letter-spacing: 0.5px; color: #fff; text-transform: uppercase; white-space: nowrap;
        }

        .logo-text-fused .fused-mark {
            background: #fff; color: #000; padding: 1px 5px; border-radius: 4px; margin-right: 5px; font-weight: 900;
        }

        nav { display: flex; gap: 1.2rem; align-items: center; }
        .nav-link { font-size: 0.78rem; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }
        .nav-link:hover { color: var(--accent-white); }
        .nav-cta { color: #000 !important; background: var(--accent-white); padding: 6px 12px; border-radius: 20px; }
        .nav-cta:hover { background: #e0e0e0; }

        .portfolio-header { text-align: center; padding: 2.5rem 1rem 0.8rem; }
        .portfolio-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 8px; }

        .filters {
            display: flex; justify-content: center; gap: 0.4rem; padding: 0.8rem 1rem 2rem; flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-dark); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 0.45rem 1rem; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 0.75rem; transition: all 0.25s ease;
        }

        .filter-btn.active { color: #000; background: var(--accent-white); border-color: var(--accent-white); }

        .gallery-container { max-width: 1500px; margin: 0 auto; padding: 0 1rem 4rem; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }

        .gallery-item {
            position: relative; border-radius: 8px; overflow: hidden; background: var(--card-dark);
            border: 1px solid var(--border-color); aspect-ratio: 4 / 5; cursor: pointer;
        }

        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .gallery-item:hover img { transform: scale(1.05); }

        .item-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 0.8rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
            opacity: 0; transition: opacity 0.3s ease;
        }

        .gallery-item:hover .item-overlay { opacity: 1; }
        .item-tag { font-size: 0.65rem; text-transform: uppercase; font-weight: 800; color: #fff; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; }

        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .lightbox img { max-width: 90%; max-height: 85vh; object-fit: contain; border-radius: 6px; }
        .close-lightbox { position: absolute; top: 20px; right: 25px; font-size: 2.2rem; cursor: pointer; color: #fff; z-index: 2100; }
        
        .lightbox-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.15); color: #fff;
            border: 1px solid rgba(255,255,255,0.3); font-size: 1.8rem;
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: background 0.2s; z-index: 2100; user-select: none;
        }
        .lightbox-arrow:hover { background: rgba(255,255,255,0.4); }
        .arrow-prev { left: 15px; }
        .arrow-next { right: 15px; }

        @media(max-width: 480px) {
            header { padding: 0.6rem 3%; }
            .brand-logo-img { width: 30px; height: 30px; }
            .logo-text-fused { font-size: 0.85rem; }
            nav { gap: 0.6rem; }
            .nav-link { font-size: 0.68rem; }
            .nav-home { display: none; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
            .item-overlay { opacity: 1; }
            .lightbox-arrow { width: 36px; height: 36px; font-size: 1.3rem; }
            .arrow-prev { left: 8px; }
            .arrow-next { right: 8px; }
        }

        footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.8rem; }
        footer a { color: var(--accent-white); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand-wrapper">
            <img src="logo.jpeg" alt="KB Media Logo" class="brand-logo-img">
            <div class="logo-text-fused"><span class="fused-mark">KB</span> MEDIA</div>
        </a>

        <nav>
            <a href="index.html" class="nav-link nav-home">HOME</a>
            <a href="portfolio.html" class="nav-link" style="color:#fff;">PORTFOLIO</a>
            <a href="about.html" class="nav-link">ABOUT</a>
            <a href="bookings.html" class="nav-link nav-cta">BOOK</a>
        </nav>
    </header>

    <div class="portfolio-header">
        <h1>Portfolio</h1>
    </div>

    <section class="filters">
        <button class="filter-btn" data-cat="all" onclick="filterGallery('all')">All Work</button>
        <button class="filter-btn" data-cat="sports" onclick="filterGallery('sports')">Soccer</button>
        <button class="filter-btn" data-cat="baseball" onclick="filterGallery('baseball')">Baseball & Softball</button>
        <button class="filter-btn" data-cat="portraits" onclick="filterGallery('portraits')">Portraits</button>
        <button class="filter-btn" data-cat="church" onclick="filterGallery('church')">Events</button>
        <button class="filter-btn" data-cat="realestate" onclick="filterGallery('realestate')">Real Estate</button>
        <button class="filter-btn" data-cat="cars" onclick="filterGallery('cars')">Automotive</button>
    </section>

    <section class="gallery-container">
        <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <div class="lightbox" id="lightboxModal">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        <div class="lightbox-arrow arrow-prev" onclick="navigateLightbox(-1)">&#10094;</div>
        <img id="lightboxTarget" src="" alt="Expanded View">
        <div class="lightbox-arrow arrow-next" onclick="navigateLightbox(1)">&#10095;</div>
    </div>

    <footer>
        &copy; 2026 KB Media. Photo • Video • Content. | <a href="https://www.instagram.com/kbmedia.ca/" target="_blank">Instagram</a>
    </footer>

    <script>
        // To add a photo: put the full-size file in the folder, then add its number to the list below.
        // Each category shows in the order listed, best shots first.
        const categories = [
            { key: 'sports',     tag: 'Soccer',      folder: 'imagesSports',     prefix: 'Sports',     nums: [9, 29, 10, 30, 21, 31, 7, 32, 33, 15, 14, 35, 36, 27, 37, 22, 38, 26, 39, 24, 40, 41, 3, 42, 17, 43, 4, 44, 45, 23, 46, 11, 47, 48, 28, 49, 25, 50, 51, 20, 52, 6, 53, 5, 54, 18, 55, 56, 57, 58, 59, 60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 76, 77, 78, 79, 80, 81, 82, 83, 84, 85, 86] },
            { key: 'baseball',   tag: 'Baseball',    folder: 'imagesSports',     prefix: 'Sports',     nums: [87, 12, 88, 89, 1, 90, 91, 2, 92, 93, 94, 8, 95, 96, 97, 98, 99, 100, 101, 102] },
            { key: 'portraits',  tag: 'Portraits',   folder: 'imagesPortraits',  prefix: 'Portrait',   nums: [10, 4, 13, 11, 2, 12, 15, 9, 16, 14, 5, 17, 18, 3, 19, 20, 7, 21, 22, 6, 8, 23, 1] },
            { key: 'church',     tag: 'Events',      folder: 'imageChurch',      prefix: 'Church',     nums: [8, 7, 1, 9, 2, 3, 4, 5, 6] },
            { key: 'realestate', tag: 'Real Estate', folder: 'imagesRealestate', prefix: 'Realestate', nums: [6, 5, 2, 4, 9, 7, 10, 16, 18] },
            { key: 'cars',       tag: 'Automotive',  folder: 'imageCars',        prefix: 'Car',        nums: [2, 3, 1, 4, 5] }
        ];

        const byCategory = categories.map(c => c.nums.map(n => ({
            category: c.key,
            tag: c.tag,
            title: `${c.tag} photo by KB Media`,
            thumb: `images/thumbs/${c.folder}/${c.prefix}-${n}.jpg`,
            src: `images/${c.folder}/${c.prefix}-${n}.jpg`
        })));

        // "All Work" mixes the categories in turn so it doesn't open with 80 soccer photos in a row.
        const portfolioData = [];
        for (let i = 0; i < Math.max(...byCategory.map(l => l.length)); i++) {
            byCategory.forEach(l => { if (l[i]) portfolioData.push(l[i]); });
        }

        let activeItemsList = [];
        let currentLightboxIndex = 0;

        function renderGrid(cat = 'all') {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            activeItemsList = (cat === 'all') ? portfolioData : portfolioData.filter(i => i.category === cat);

            activeItemsList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `gallery-item`;
                card.onclick = () => openLightbox(index);
                card.innerHTML = `
                    <img src="${item.thumb}" alt="${item.title}" loading="lazy" onerror="this.closest('.gallery-item').remove();">
                    <div class="item-overlay"><span class="item-tag">${item.tag}</span></div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGallery(category) {
            if (!categories.some(c => c.key === category)) category = 'all';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === category));
            renderGrid(category);
        }

        function openLightbox(index) {
            currentLightboxIndex = index;
            document.getElementById('lightboxTarget').src = activeItemsList[currentLightboxIndex].src;
            document.getElementById('lightboxModal').style.display = 'flex';
        }

        function closeLightbox() { document.getElementById('lightboxModal').style.display = 'none'; }

        function navigateLightbox(direction) {
            currentLightboxIndex = (currentLightboxIndex + direction + activeItemsList.length) % activeItemsList.length;
            document.getElementById('lightboxTarget').src = activeItemsList[currentLightboxIndex].src;
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('lightboxModal');
            if (modal.style.display === 'flex') {
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
                if (e.key === 'Escape') closeLightbox();
            }
        });

        document.getElementById('lightboxModal').addEventListener('click', (e) => {
            if (e.target.id === 'lightboxModal') closeLightbox();
        });

        // Swipe left/right on phones to move through the lightbox.
        let touchStartX = null;
        const lightbox = document.getElementById('lightboxModal');
        lightbox.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
        lightbox.addEventListener('touchend', (e) => {
            if (touchStartX === null) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 50) navigateLightbox(dx < 0 ? 1 : -1);
            touchStartX = null;
        });

        const urlParams = new URLSearchParams(window.location.search);
        filterGallery(urlParams.get('cat') || 'all');
    </script>
</body>
</html>

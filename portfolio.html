<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Media | Complete Gallery Portfolio</title>
    <style>
        :root {
            --bg-dark: #050505;
            --card-dark: #121212;
            --accent-white: #ffffff;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --border-color: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); }
        a { text-decoration: none; color: inherit; }

        header {
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(5, 5, 5, 0.95);
            position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .brand-wrapper { display: flex; align-items: center; gap: 12px; }
        .brand-logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.3); }
        
        .logo-text-fused {
            display: flex;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
        }

        .logo-text-fused .fused-mark {
            background: #fff;
            color: #000;
            padding: 1px 6px;
            border-radius: 4px;
            margin-right: 6px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        nav { display: flex; gap: 1.5rem; }
        .nav-link { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; }
        .nav-link:hover { color: var(--accent-white); }

        .portfolio-header { text-align: center; padding: 3rem 1rem 1rem; }
        .portfolio-header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 10px; }

        /* CATEGORY FILTER PILLS */
        .filters {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 1rem 2.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.25s ease;
        }

        .filter-btn.active { color: #000; background: var(--accent-white); border-color: var(--accent-white); }

        /* MASONRY GALLERY GRID */
        .gallery-container { max-width: 1500px; margin: 0 auto; padding: 0 1rem 5rem; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }

        .gallery-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            aspect-ratio: 4 / 5;
            cursor: pointer;
        }

        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .gallery-item:hover img { transform: scale(1.05); }

        .item-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 1rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
            opacity: 0; transition: opacity 0.3s ease;
        }

        .gallery-item:hover .item-overlay { opacity: 1; }
        .item-tag { font-size: 0.7rem; text-transform: uppercase; font-weight: 800; color: #fff; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; }

        /* LIGHTBOX WITH NAVIGATION CONTROLS */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .lightbox img { max-width: 90%; max-height: 85vh; object-fit: contain; border-radius: 6px; }
        .close-lightbox { position: absolute; top: 20px; right: 25px; font-size: 2.2rem; cursor: pointer; color: #fff; z-index: 2100; }
        
        .lightbox-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.15); color: #fff;
            border: 1px solid rgba(255,255,255,0.3); font-size: 2rem;
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: background 0.2s; z-index: 2100;
            user-select: none;
        }
        .lightbox-arrow:hover { background: rgba(255,255,255,0.4); }
        .arrow-prev { left: 20px; }
        .arrow-next { right: 20px; }

        @media(max-width: 768px) {
            header { padding: 1rem 4%; }
            nav { gap: 0.8rem; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
            .item-overlay { opacity: 1; }
            .lightbox-arrow { width: 40px; height: 40px; font-size: 1.5rem; }
            .arrow-prev { left: 10px; }
            .arrow-next { right: 10px; }
        }

        footer { text-align: center; padding: 2.5rem; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand-wrapper">
            <img src="logo.jpeg" alt="KB Media Logo" class="brand-logo-img">
            <div class="logo-text-fused">
                <span class="fused-mark">K3</span> MEDIA
            </div>
        </a>

        <nav>
            <a href="index.html" class="nav-link">HOME</a>
            <a href="portfolio.html" class="nav-link" style="color:#fff;">PORTFOLIO</a>
            <a href="https://www.instagram.com/" target="_blank" class="nav-link">CONTACT</a>
        </nav>
    </header>

    <div class="portfolio-header">
        <h1>Master Media Archive</h1>
    </div>

    <section class="filters">
        <button class="filter-btn active" onclick="filterGallery('all', event)">All Work</button>
        <button class="filter-btn" onclick="filterGallery('sports', event)">Sports</button>
        <button class="filter-btn" onclick="filterGallery('portraits', event)">Portraits</button>
        <button class="filter-btn" onclick="filterGallery('cars', event)">Automotive</button>
        <button class="filter-btn" onclick="filterGallery('church', event)">Church</button>
        <button class="filter-btn" onclick="filterGallery('weddings', event)">Weddings</button>
        <button class="filter-btn" onclick="filterGallery('realestate', event)">Real Estate</button>
    </section>

    <section class="gallery-container">
        <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <!-- LIGHTBOX MODAL WITH PREV / NEXT NAV -->
    <div class="lightbox" id="lightboxModal">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        <div class="lightbox-arrow arrow-prev" onclick="navigateLightbox(-1)">&#10094;</div>
        <img id="lightboxTarget" src="" alt="Expanded View">
        <div class="lightbox-arrow arrow-next" onclick="navigateLightbox(1)">&#10095;</div>
    </div>

    <footer>
        &copy; 2026 KB Media. Photo • Video • Content.
    </footer>

    <script>
        const portfolioData = [];

        // Sports (1-28)
        for (let i = 1; i <= 28; i++) {
            portfolioData.push({ category: 'sports', tag: 'Sports', title: `Sports Capture #${i}`, src: `images/imagesSports/Sports-${i}.jpg` });
        }
        // Real Estate (1-18)
        for (let i = 1; i <= 18; i++) {
            portfolioData.push({ category: 'realestate', tag: 'Real Estate', title: `Property #${i}`, src: `images/imagesRealestate/Realestate-${i}.jpg` });
        }
        // Portraits (1-8)
        for (let i = 1; i <= 8; i++) {
            portfolioData.push({ category: 'portraits', tag: 'Portraits', title: `Portrait #${i}`, src: `images/imagesPortraits/Portrait-${i}.jpg` });
        }
        // Church (1-5)
        for (let i = 1; i <= 5; i++) {
            portfolioData.push({ category: 'church', tag: 'Church', title: `Church Media #${i}`, src: `images/imageChurch/Church-${i}.jpg` });
        }
        // Automotive (1-5)
        for (let i = 1; i <= 5; i++) {
            portfolioData.push({ category: 'cars', tag: 'Automotive', title: `Car Shoot #${i}`, src: `images/imageCars/Car-${i}.jpg` });
        }
        // Weddings
        const weddings = [
            'https://images.unsplash.com/photo-1519741497674-611481863552?w=800',
            'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=800',
            'https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=800'
        ];
        weddings.forEach((url, index) => {
            portfolioData.push({ category: 'weddings', tag: 'Weddings', title: `Wedding #${index + 1}`, src: url });
        });

        function shuffle(arr) {
            return arr.slice().sort(() => Math.random() - 0.5);
        }

        const shuffledData = shuffle(portfolioData);
        let activeItemsList = [];
        let currentLightboxIndex = 0;

        function renderGrid(cat = 'all') {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            activeItemsList = (cat === 'all') ? shuffledData : portfolioData.filter(i => i.category === cat);

            activeItemsList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `gallery-item`;
                card.onclick = () => openLightbox(index);
                card.innerHTML = `
                    <img src="${item.src}" alt="${item.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800';">
                    <div class="item-overlay">
                        <span class="item-tag">${item.tag}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGallery(category, event) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(event) event.target.classList.add('active');
            renderGrid(category);
        }

        function openLightbox(index) {
            currentLightboxIndex = index;
            document.getElementById('lightboxTarget').src = activeItemsList[currentLightboxIndex].src;
            document.getElementById('lightboxModal').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').style.display = 'none';
        }

        function navigateLightbox(direction) {
            currentLightboxIndex = (currentLightboxIndex + direction + activeItemsList.length) % activeItemsList.length;
            document.getElementById('lightboxTarget').src = activeItemsList[currentLightboxIndex].src;
        }

        // KEYBOARD NAVIGATION CONTROLS (Left / Right / Escape)
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('lightboxModal');
            if (modal.style.display === 'flex') {
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
                if (e.key === 'Escape') closeLightbox();
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const urlCat = urlParams.get('cat') || 'all';
        renderGrid(urlCat);
    </script>
</body>
</html>
